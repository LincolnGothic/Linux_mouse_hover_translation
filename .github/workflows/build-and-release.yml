name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Ubuntu 26.04 build and test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git \
            build-essential cmake ninja-build pkg-config file \
            qt6-base-dev qt6-base-dev-tools qt6-scxml-dev qt6-svg-plugins qt6-wayland \
            libtesseract-dev libleptonica-dev libxcb1-dev libxcb-xtest0-dev \
            tesseract-ocr-eng tesseract-ocr-chi-sim fonts-noto-cjk \
            xvfb xauth x11-utils dbus-x11 weston python3-venv \
            gnome-shell gjs python3-gi python3-cairo gir1.2-gtk-4.0 adwaita-icon-theme nodejs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          cmake --build build --parallel 2
      - name: Exercise OCR, X11 hover and screenshot portal protocol
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1200x900x24' ctest --test-dir build --output-on-failure
      - name: Exercise GNOME hover timing and monitor geometry
        run: node tests/test_gnome_policy.mjs
      - name: Exercise the native Wayland reader
        run: bash tools/test-wayland.sh build
      - name: Install and exercise real offline sentence models
        run: |
          model_log_path="$RUNNER_TEMP/hover-model-validation.log"
          if python3 offline/setup_offline.py --data-dir "$RUNNER_TEMP/hover-offline" --without-dictionary >"$model_log_path" 2>&1 \
            && python3 tests/check_offline_models.py ./build/hover-translate \
              --python "$RUNNER_TEMP/hover-offline/argos-env/bin/python" \
              --models-dir "$RUNNER_TEMP/hover-offline/argos-packages" >>"$model_log_path" 2>&1; then
            cat "$model_log_path"
          else
            cat "$model_log_path"
            python3 - "$model_log_path" <<'PY'
          from pathlib import Path
          import sys
          # GitHub truncates individual annotation messages at 4096 characters.
          detail = Path(sys.argv[1]).read_text(errors="replace")[-3000:]
          detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Offline sentence-model validation::" + detail)
          PY
            exit 1
          fi
      - name: Exercise GNOME Wayland hover with real offline models
        env:
          HOVER_GNOME_MODEL_PYTHON: ${{ runner.temp }}/hover-offline/argos-env/bin/python
          HOVER_GNOME_MODELS_DIR: ${{ runner.temp }}/hover-offline/argos-packages
        run: bash tools/test-gnome.sh build
      - name: Package binary and corresponding source
        run: |
          umask 022
          cpack --config build/CPackConfig.cmake -B build/release
          cpack --config build/CPackSourceConfig.cmake -B build/release
          cd build/release
          sha256sum *.deb *Source.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hover-translate-${{ github.sha }}
          path: |
            build/release/*.deb
            build/release/*Source.tar.gz
            build/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hover-translate-${{ github.sha }}
          path: release-assets
      - name: Publish the tagged version and its corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
            --title "Hover Translate $RELEASE_TAG (preview)" \
            --notes-file "docs/RELEASE-NOTES-${RELEASE_TAG#v}.md" \
            release-assets/*.deb release-assets/*Source.tar.gz release-assets/SHA256SUMS
